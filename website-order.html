<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Pesan website Bali Bagus Dev dengan pilihan checkout akun atau WhatsApp."><title>Pesan Website — Bali Bagus Dev</title><link rel="stylesheet" href="assets/css/style.css"><link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml"><link rel="canonical" href="https://baguskristiansianturi.github.io/bali-bagus-dev-studio/website-order.html"><meta property="og:type" content="website"><meta property="og:title" content="Pesan Website — Bali Bagus Dev"><meta property="og:description" content="Pilih paket dan template website Bali Bagus Dev, kirim brief, lalu lanjutkan proses pemesanan."><meta property="og:url" content="https://baguskristiansianturi.github.io/bali-bagus-dev-studio/website-order.html"><meta property="og:site_name" content="Bali Bagus Dev"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="Pesan Website — Bali Bagus Dev"><meta name="twitter:description" content="Pilih paket dan template website Bali Bagus Dev, kirim brief, lalu lanjutkan proses pemesanan."></head><body><a class="skip-link" href="#main">Lewati ke konten</a><div class="announcement">Pemesanan website · pilih checkout akun atau WhatsApp</div><header class="site-header"></header><main id="main" class="wrap page-main"><div class="eyebrow">WEBSITE ORDER / 005</div><h1>Pesan website<br><em>yang Anda pilih.</em></h1><p class="lead">Paket dan template sudah dibawa otomatis dari halaman sebelumnya. Lengkapi brief singkat, lalu pilih cara pemesanan.</p><div class="order-flow-grid"><form class="form-card" id="websiteOrderForm"><h2>Detail pemesanan</h2><label>Paket website<input id="orderPackage" readonly><input id="orderPackageId" name="packageId" type="hidden"></label><label>Template / website<input id="orderTemplate" readonly><input id="orderTemplateId" name="templateId" type="hidden"></label><label>Nama lengkap<input name="name" required autocomplete="name" placeholder="Nama Anda"></label><label>Email<input name="email" type="email" required autocomplete="email" placeholder="nama@email.com"></label><label>WhatsApp / nomor kontak<input name="phone" required autocomplete="tel" placeholder="+62..."></label><label>Nama bisnis<input name="business" required placeholder="Nama usaha / brand"></label><label>Kebutuhan atau catatan<textarea name="details" rows="5" placeholder="Misalnya: ingin mengganti warna, foto, layanan, harga, lokasi, tombol WhatsApp, dan lain-lain."></textarea><label class="check-label"><input name="consent" type="checkbox" required> Saya menyetujui data ini digunakan untuk memproses permintaan website.</label><div class="order-actions"><button class="button button-dark full" type="submit">Buat akun & lanjut checkout ↗</button><button id="orderWhatsApp" class="button whatsapp-button full" type="button">Pesan via WhatsApp ↗</button></div><p class="form-note">Dengan akun, pesanan dapat disimpan untuk riwayat, promo email, wishlist, pengembangan, perubahan, dan upgrade di kemudian hari.</p></form><aside class="order-side"><div class="eyebrow">DUA CARA MEMESAN</div><h2>Pilih cara yang paling nyaman.</h2><div class="order-method"><b>01 / AKUN</b><p>Buat akun sekali. Pesanan dan pengembangan berikutnya lebih mudah dilacak dari satu tempat.</p><span>Order history · promo · wishlist · upgrade</span></div><div class="order-method"><b>02 / WHATSAPP</b><p>Kirim form yang sama sebagai pesan terstruktur ke WhatsApp. Anda dapat berdiskusi langsung sebelum keputusan final.</p><span>Form → pesan terformat → chat</span></div><div class="order-note"><b>Catatan produksi</b><p>Checkout, pembayaran, email otomatis, dan sinkronisasi order membutuhkan backend produksi. Versi ini menyiapkan alur dan data yang akan dipakai saat backend diaktifkan.</p></div></aside></div></main><footer id="siteFooter"></footer><script src="assets/js/app.js"></script></body></html>
