name: Export repository ZIP
on:
  push:
    branches: [main]
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package repository
        run: zip -r bali-bagus-dev-studio.zip . -x ".git/*"
      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: bali-bagus-dev-studio
          path: bali-bagus-dev-studio.zip
